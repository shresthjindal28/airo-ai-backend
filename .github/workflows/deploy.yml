name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (e.g. latest or commit SHA)"
        required: false
        default: latest
        type: string

concurrency:
  group: deploy-airo-ai-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONTAINER_NAME: airo-ai
  APP_PORT: 8001
  DEPLOY_DIR: ~/airo-ai-backend

jobs:
  build-and-deploy:
    name: Build, deploy, and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}:latest"
          docker run --rm --entrypoint python "${IMAGE_NAME}:latest" -c "import app.main; print('Application import OK')"

      - name: Deploy to EC2
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/airo-ai-backend"
            mkdir -p "$DEPLOY_DIR"

            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              echo "ERROR: $DEPLOY_DIR/.env not found on EC2."
              echo "Create it manually on the server before deploying."
              exit 1
            fi

            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_PULL_TOKEN secret is not configured."
              echo "Add a GitHub PAT with read:packages scope as repository secret GHCR_PULL_TOKEN."
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull "$IMAGE"

            docker rm -f "${{ env.CONTAINER_NAME }}" 2>/dev/null || true

            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              --env-file "$DEPLOY_DIR/.env" \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              "$IMAGE"

            docker image prune -f

            echo "Deployed image: $IMAGE"

      - name: Verify deployment health
        id: health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "Waiting for ${{ env.CONTAINER_NAME }} to become healthy..."
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${{ env.APP_PORT }}/ready" >/dev/null; then
                echo "Readiness check passed on attempt ${attempt}"
                curl -fsS "http://127.0.0.1:${{ env.APP_PORT }}/health"
                exit 0
              fi
              echo "Attempt ${attempt}/30: service not ready yet"
              sleep 5
            done

            echo "Readiness check failed after 150 seconds"
            docker ps -a --filter "name=${{ env.CONTAINER_NAME }}"
            docker logs "${{ env.CONTAINER_NAME }}" --tail 100 || true
            exit 1

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Deployment ${{ job.status == 'success' && 'succeeded' || 'failed' }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Actor | \`${{ github.actor }}\` |"
            echo "| Health check | \`${{ steps.health.outcome || 'skipped' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "::error::Deployment failed for commit ${{ github.sha }}. Check the workflow logs and EC2 container logs."
